<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!--Design Search box-->
    <div class="card">
        <div class="search">
            <input type="search" name="" id="" placeholder="Enter city name" spellcheck="false">
            <button><img src="./img/search.png" alt="search-icon"></button>
        </div>
        <div class="error">
            <p>Invalid city name!</p>
        </div>
        <!--Display weather condition-->
        <div class="weather">
            <img src="./img/rain.png" class="weather-icon" alt="rain-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <!--Details-->
            <div class="details">
                <div class="col">
                    <img src="./img/humidity.png" alt="humidity">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="./img/wind.png" alt="wind">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
        <!--End Weather conditon-->
    </div>
    <!--End Search box-->
    <script src="./script.js"></script>
</body>
</html>
